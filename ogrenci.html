<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Deneme Sonuçları</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3a0ca3;
            --success: #2ec4b6;
            --warning: #ff9f1c;
            --danger: #e71d36;
            --light: #f8f9fa;
            --border: #dee2e6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1000px; background: white; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); overflow: hidden; }
        
        .header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 25px 20px; text-align: center; }
        .header h1 { font-size: 1.8rem; margin-bottom: 8px; }
        .header p { font-size: 1rem; opacity: 0.8; }
        
        .content { padding: 25px; display: flex; flex-direction: column; gap: 25px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card-title { color: var(--primary); font-size: 1.2rem; margin-bottom: 15px; font-weight: 600; border-bottom: 2px solid var(--light); padding-bottom: 10px; }
        
        .student-name { font-size: 1.6rem; font-weight: 700; color: var(--secondary); text-align: center; margin-bottom: 20px; }
        
        .section-title { color: var(--secondary); font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; margin-top: 15px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .stat-item { background: var(--light); padding: 15px 10px; border-radius: 10px; text-align: center; border: 1px solid var(--border); }
        .stat-label { font-size: 0.8rem; color: #6c757d; margin-bottom: 8px; font-weight: 600; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); }
        th { background: var(--primary); color: white; font-weight: 600; }
        tr:nth-child(even) { background: var(--light); }
        .up { color: var(--success); font-weight: bold; }
        .down { color: var(--danger); font-weight: bold; }
        
        .btn-show-all { 
            display: block; width: 100%; padding: 12px; margin-top: 15px; 
            background: #e3f2fd; color: var(--primary); border: 1px solid #bbdefb; 
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-show-all:hover { background: #bbdefb; }

        .chart-container { position: relative; height: 300px; width: 100%; }
        .loading { text-align: center; padding: 40px; font-size: 1.2rem; color: var(--primary); font-weight: bold; }
        .error-box { background: #f8d7da; color: #721c24; padding: 30px; border-radius: 10px; text-align: center; }
        
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            th, td { padding: 10px 5px; font-size: 0.8rem; }
            .header h1 { font-size: 1.5rem; }
            .chart-container { height: 250px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Öğrenci Sonuç Belgesi</h1>
            <p>Detaylı performans analizi</p>
        </div>

        <div class="content">
            <div class="card" id="infoCard">
                <div id="studentInfo">
                    <div class="loading">Veriler Yükleniyor...</div>
                </div>
            </div>

            <div class="card" id="historyCard">
                <div class="card-title">📅 Geçmiş Denemeler</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Tarih</th>
                                <th>Deneme</th>
                                <th>Net</th>
                                <th>Yüzde (%)</th>
                                <th>Sıra</th>
                                <th>Sınıf Ort.</th>
                                <th>Net Değişim</th>
                            </tr>
                        </thead>
                        <tbody id="examHistoryBody"></tbody>
                    </table>
                </div>
                <button class="btn-show-all" id="btnShowAll" onclick="showAllExams()" style="display: none;">Tümünü Gör</button>
            </div>

            <div class="card" id="chartCard">
                <div class="card-title">📈 Net Değişim Grafiği (Tüm Denemeler)</div>
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');
    let globalData = null; // Veriyi buton için saklayacağız

    if (!studentId) {
        document.getElementById('studentInfo').innerHTML = `<div class="error-box"><h3>Hata</h3><p>Lütfen geçerli bir öğrenci numarası girin.</p></div>`;
        document.getElementById('historyCard').style.display = 'none';
        document.getElementById('chartCard').style.display = 'none';
    } else {
        verileriYukle();
    }

    async function verileriYukle() {
        try {
            const res = await fetch(`data/${studentId}.json?t=${Date.now()}`);
            if (!res.ok) throw new Error('Kayıt bulunamadı');
            const data = await res.json();
            globalData = data; // Sakla

            if (!data.exams || data.exams.length === 0) {
                document.getElementById('studentInfo').innerHTML = `<div class="error-box"><h3>Veri Yok</h3><p>Bu öğrenciye ait henüz girilmiş bir sonuç bulunmuyor.</p></div>`;
                document.getElementById('historyCard').style.display = 'none';
                document.getElementById('chartCard').style.display = 'none';
                return;
            }

            const sinifListesi = ["145","157","371","462","562","752","756","801","811","853","893","981","1023","1076","1142"];
            
            const tumVeriler = await Promise.all(sinifListesi.map(async id => {
                try {
                    const r = await fetch(`data/${id}.json?t=${Date.now()}`);
                    if (r.ok) return await r.json();
                } catch(e) { return null; }
                return null;
            }));

            const ortalamalar = tumVeriler.filter(v => v !== null && v.exams && v.exams.length > 0).map(v => {
                const toplam = v.exams.reduce((sum, e) => sum + e.score, 0);
                return { id: v.id, name: v.name, ortalama: toplam / v.exams.length };
            });

            ortalamalar.sort((a, b) => b.ortalama - a.ortalama);
            
            const ogrIndex = ortalamalar.findIndex(o => o.id === studentId);
            const genelSiralama = ogrIndex !== -1 ? ogrIndex + 1 : null;
            const genelToplamOgrenci = ortalamalar.length;
            
            const ogrToplamNet = data.exams.reduce((sum, e) => sum + e.score, 0);
            const ogrOrtalama = (ogrToplamNet / data.exams.length).toFixed(1);

            displayStudentInfo(data, ogrOrtalama, genelSiralama, genelToplamOgrenci);
            
            // İlk yüklemede son 5 denemeyi göster
            displayExamHistory(data, 5);
            
            // Eğer 5'ten fazla deneme varsa butonu göster
            if (data.exams.length > 5) {
                document.getElementById('btnShowAll').style.display = 'block';
            }

            createChart(data);

        } catch (error) {
            document.getElementById('studentInfo').innerHTML = `<div class="error-box"><h3>Kayıt Bulunamadı</h3><p>${studentId} numaralı öğrenciye ait veri yok.</p></div>`;
            document.getElementById('historyCard').style.display = 'none';
            document.getElementById('chartCard').style.display = 'none';
        }
    }

    function showAllExams() {
        if (globalData) {
            displayExamHistory(globalData, globalData.exams.length);
            document.getElementById('btnShowAll').style.display = 'none'; // Butonu gizle
        }
    }

    function formatDate(dateString) {
        const date = new Date(dateString);
        return `${date.getDate().toString().padStart(2, '0')}.${(date.getMonth() + 1).toString().padStart(2, '0')}.${date.getFullYear()}`;
    }

    function displayStudentInfo(data, ogrOrtalama, genelSiralama, genelToplamOgrenci) {
        const infoDiv = document.getElementById('studentInfo');
        const latest = data.exams[0];
        
        const yuzde = latest.yuzde ? `%${latest.yuzde}` : '-';
        const sinifOrt = latest.classAverage ? latest.classAverage : '-';
        
        let genelSiralamaText = genelSiralama ? genelSiralama : '-';

        infoDiv.innerHTML = `
            <div class="student-name">${data.name}</div>
            
            <!-- 1. Son Deneme Detayları -->
            <div class="section-title">Son Deneme Detayları</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Net</div>
                    <div class="stat-value">${latest.score}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Başarı Yüzdesi</div>
                    <div class="stat-value" style="color: var(--success);">${yuzde}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Sınıf Ortalaması</div>
                    <div class="stat-value" style="color: var(--warning);">${sinifOrt}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Deneme Sırası</div>
                    <div class="stat-value">${latest.rank}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Katılan Öğrenci</div>
                    <div class="stat-value">${latest.totalStudents}</div>
                </div>
            </div>

            <!-- 2. Genel Durum (Tüm Denemeler) -->
            <div class="section-title" style="margin-top: 25px;">Genel Durum (Tüm Denemeler)</div>
            <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="stat-item" style="background: #e3f2fd; border-color: #bbdefb;">
                    <div class="stat-label">Genel Net Ortalaması</div>
                    <div class="stat-value" style="font-size: 1.6rem;">${ogrOrtalama}</div>
                </div>
                <div class="stat-item" style="background: #fff3cd; border-color: #ffeeba;">
                    <div class="stat-label">Genel Sıralama</div>
                    <div class="stat-value" style="font-size: 1.6rem;">${genelSiralamaText}</div>
                </div>
                <div class="stat-item" style="background: #d4edda; border-color: #c3e6cb;">
                    <div class="stat-label">Sınıf Mevcudu</div>
                    <div class="stat-value" style="font-size: 1.6rem;">${genelToplamOgrenci}</div>
                </div>
            </div>
        `;
    }

    // Limite göre tabloyu doldurur
    function displayExamHistory(data, limit) {
        const tbody = document.getElementById('examHistoryBody');
        tbody.innerHTML = '';

        // Sadece belirtilen limite kadar olanları al
        const examsToShow = data.exams.slice(0, limit);

        examsToShow.forEach((exam, index) => {
            let netDegisim = '-';
            // Değişim hesaplarken tüm verideki bir sonraki sınava bakmalıyız
            const globalIndex = data.exams.findIndex(e => e === exam);
            if (globalIndex < data.exams.length - 1) {
                const prev = data.exams[globalIndex + 1];
                const diff = (exam.score - prev.score).toFixed(1);
                if (diff > 0) netDegisim = `<span class="up">+${diff}</span>`;
                else if (diff < 0) netDegisim = `<span class="down">${diff}</span>`;
                else netDegisim = '0';
            }
            
            const yuzde = exam.yuzde ? `%${exam.yuzde}` : '-';
            const sinifOrt = exam.classAverage ? exam.classAverage : '-';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${formatDate(exam.examDate)}</td>
                <td>${exam.examName}</td>
                <td><strong>${exam.score}</strong></td>
                <td>${yuzde}</td>
                <td>${exam.rank}</td>
                <td>${sinifOrt}</td>
                <td>${netDegisim}</td>
            `;
            tbody.appendChild(row);
        });
    }

    function createChart(data) {
        const exams = data.exams.slice().reverse(); // Grafikte en eskiden en yeniye doğru gitsin
        const labels = exams.map(e => e.examName);
        const scores = exams.map(e => e.score);

        const ctx = document.getElementById('scoreChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Net',
                    data: scores,
                    borderColor: '#4361ee',
                    backgroundColor: 'rgba(67, 97, 238, 0.1)',
                    borderWidth: 3,
                    tension: 0.3,
                    fill: true,
                    pointBackgroundColor: '#4361ee',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 7
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }
    </script>
</body>
</html>
