<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBS Yönetici Paneli</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; font-size: 22px; }
        
        .ayar-alani, .token-alani { padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .token-alani { background: #fff3cd; border: 1px solid #ffeeba; }
        .ayar-alani { background: #e3f2fd; border: 1px solid #bbdefb; }
        
        .ayar-alani input, .token-alani input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; font-size: 15px; }
        
        .sinif-listesi { max-height: 50vh; overflow-y: auto; border: 2px solid #e9ecef; border-radius: 10px; padding: 10px; margin-bottom: 20px; }
        .ogrenci-satiri { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; transition: 0.3s; }
        .ogrenci-satiri.basarili { background-color: #d4edda; pointer-events: none; opacity: 0.7; }
        .ogrenci-satiri.hatali { background-color: #f8d7da; }
        
        .ogrenci-bilgi { flex: 1; }
        .ogrenci-adi { font-weight: bold; color: #2c3e50; font-size: 15px; }
        .ogrenci-id { font-size: 11px; color: #888; }
        .net-input { width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; text-align: center; font-size: 15px; margin-right: 10px; }
        
        .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; min-width: 200px; }
        .btn-olustur { background: #28a745; color: white; }
        .btn-olustur:hover { background: #218838; }
        .btn-tekrar { background: #dc3545; color: white; display: none; }
        .btn-tekrar:hover { background: #c82333; }
        .btn-temizle { background: #6c757d; color: white; }
        
        .sonuc { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        .info { background: #d1ecf1; color: #0c5460; display: block; }
        
        .girmedi-checkbox { transform: scale(1.3); margin-left: 10px; }
        @media (max-width: 600px) { .ogrenci-satiri { flex-direction: column; align-items: flex-start; gap: 10px; } .net-input { width: 100%; margin-right: 0; margin-bottom: 5px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 VBS Net Girişi</h1>
        
        <div class="token-alani">
            <label><strong>🔑 GitHub Token:</strong> (Sadece bir kez girilir)</label>
            <input type="password" id="tokenInput" placeholder="ghp_... şeklinde token">
        </div>

        <div class="ayar-alani">
            <label><strong>📝 Deneme Adı:</strong></label>
            <input type="text" id="denemeAdiInput" placeholder="Örn: 1. Deneme">
            
            <label style="margin-top:10px; display:block;"><strong>📊 Toplam Soru Sayısı:</strong></label>
            <input type="number" id="soruSayisiInput" min="1" placeholder="Örn: 80">
        </div>

        <div class="sinif-listesi" id="sinifListesi"></div>

        <div class="buttons">
            <button class="btn-olustur" id="btnOlustur" onclick="jsonOlustur(false)">🚀 OLUŞTUR ve KAYDET</button>
            <button class="btn-tekrar" id="btnTekrar" onclick="jsonOlustur(true)">🔄 SADECE HATALILARI TEKRAR DENE</button>
            <button class="btn-temizle" onclick="temizle()">🗑️ TEMİZLE</button>
        </div>

        <div id="sonuc" class="sonuc"></div>
    </div>

    <script>
    const GITHUB_USER = "gereksiz3x";
    const GITHUB_REPO = "vbs";
    const BRANCH = "main";

    const sinifListesi = [
        {id: "145", name: "Aşık, Hilal"},
        {id: "157", name: "Türkmenoğlu, Ömer Beren"},
        {id: "371", name: "Bindebir, Begüm"},
        {id: "462", name: "Barsan, Efe"},
        {id: "562", name: "Akkanat, Durmuş Efe"},
        {id: "752", name: "Cifçi, Belinay"},
        {id: "756", name: "Çağlar, Yarım"},
        {id: "801", name: "Kaya, Emir"},
        {id: "811", name: "Bila, Hülya"},
        {id: "853", name: "Atalan, İclal"},
        {id: "893", name: "Kılınç, Hacer"},
        {id: "981", name: "Karataş, Nurten"},
        {id: "1023", name: "Sert, Ece"},
        {id: "1076", name: "Karahanlı, Büşra"},
        {id: "1142", name: "Yılmaz, Nur Eymen"}
    ];

    let hataliOgrenciler = []; 

    window.onload = function() {
        const savedToken = localStorage.getItem('vbs_token');
        if (savedToken) document.getElementById('tokenInput').value = savedToken;
        const savedDeneme = localStorage.getItem('vbs_deneme');
        if (savedDeneme) document.getElementById('denemeAdiInput').value = savedDeneme;
        listeyiOlustur();
    };

    function listeyiOlustur() {
        const listDiv = document.getElementById('sinifListesi');
        listDiv.innerHTML = '';
        sinifListesi.forEach(ogrenci => {
            const satir = document.createElement('div');
            satir.className = 'ogrenci-satiri';
            satir.id = `satir_${ogrenci.id}`;
            satir.innerHTML = `
                <div class="ogrenci-bilgi">
                    <div class="ogrenci-adi">${ogrenci.name}</div>
                    <div class="ogrenci-id">No: ${ogrenci.id}</div>
                </div>
                <div>
                    <input type="number" class="net-input" id="net_${ogrenci.id}" placeholder="Net" step="0.25" min="0">
                    <input type="checkbox" class="girmedi-checkbox" id="girmedi_${ogrenci.id}">
                    <label for="girmedi_${ogrenci.id}" style="font-size:12px; color:#777;">Girmedi</label>
                </div>
            `;
            listDiv.appendChild(satir);

            const checkbox = satir.querySelector(`#girmedi_${ogrenci.id}`);
            const input = satir.querySelector(`#net_${ogrenci.id}`);
            checkbox.addEventListener('change', function() {
                input.disabled = this.checked;
                if(this.checked) input.value = '';
            });
        });
    }

    async function githubaKaydet(dosyaAdi, icerik, token) {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data/${dosyaAdi}`;
        let sha = null;
        
        try {
            const kontrol = await fetch(url, { headers: { Authorization: `token ${token}` } });
            if (kontrol.ok) {
                const veri = await kontrol.json();
                sha = veri.sha;
            }
        } catch(e) {}

        const base64Icerik = btoa(unescape(encodeURIComponent(icerik)));

        const response = await fetch(url, {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: `Güncelleme: ${dosyaAdi}`,
                content: base64Icerik,
                sha: sha,
                branch: BRANCH
            })
        });

        return response.ok;
    }

    async function jsonOlustur(sadeceHatalilar) {
        const sonucDiv = document.getElementById('sonuc');
        const token = document.getElementById('tokenInput').value.trim();
        const denemeAdi = document.getElementById('denemeAdiInput').value.trim();
        const toplamSoru = parseFloat(document.getElementById('soruSayisiInput').value);
        
        if (!token || !denemeAdi || !toplamSoru) {
            sonucDiv.className = 'sonuc error';
            sonucDiv.innerHTML = '❌ Lütfen Token, Deneme Adı ve Soru Sayısı alanlarını doldurun!';
            return;
        }
        
        localStorage.setItem('vbs_token', token);
        localStorage.setItem('vbs_deneme', denemeAdi);

        const islenecekler = [];
        const tumSiniNetleri = [];

        for (let ogr of sinifListesi) {
            const input = document.getElementById(`net_${ogr.id}`);
            const checkbox = document.getElementById(`girmedi_${ogr.id}`);
            const net = parseFloat(input.value);

            if (sadeceHatalilar && !hataliOgrenciler.includes(ogr.id)) continue;

            if (!checkbox.checked && !isNaN(net)) {
                islenecekler.push({ ...ogr, score: net });
                tumSiniNetleri.push(net);
            } else if (!sadeceHatalilar) {
                islenecekler.push({ ...ogr, score: null });
            }
        }

        if (islenecekler.length === 0) {
            sonucDiv.className = 'sonuc error';
            sonucDiv.innerHTML = '❌ İşlenecek öğrenci bulunamadı!';
            return;
        }

        sonucDiv.className = 'sonuc info';
        sonucDiv.innerHTML = '⏳ İşleniyor, lütfen bekleyin...';

        const girenler = islenecekler.filter(o => o.score !== null);
        girenler.sort((a, b) => b.score - a.score);
        girenler.forEach((ogr, index) => { ogr.rank = index + 1; });
        
        const sinifOrtalamasi = girenler.length > 0 ? (tumSiniNetleri.reduce((a,b)=>a+b, 0) / tumSiniNetleri.length).toFixed(1) : 0;
        const bugun = new Date().toISOString().split('T')[0];

        let basariliSayisi = 0;
        hataliOgrenciler = []; 

        for (let ogr of islenecekler) {
            const dosyaAdi = `${ogr.id}.json`;
            let mevcutExams = [];
            
            try {
                const res = await fetch(`data/${dosyaAdi}?t=${Date.now()}`);
                if (res.ok) {
                    const eskiData = await res.json();
                    mevcutExams = eskiData.exams || [];
                }
            } catch (e) {}

            const zatenVar = mevcutExams.find(e => e.examName === denemeAdi);
            if (zatenVar) {
                document.getElementById(`satir_${ogr.id}`).className = 'ogrenci-satiri basarili';
                continue; 
            }

            if (ogr.score !== null) {
                const ogrSirasi = girenler.find(o => o.id === ogr.id);
                const yuzde = ((ogr.score / toplamSoru) * 100).toFixed(1);
                
                mevcutExams.unshift({
                    examName: denemeAdi,
                    examDate: bugun,
                    score: ogr.score,
                    yuzde: yuzde,
                    rank: ogrSirasi.rank,
                    totalStudents: girenler.length,
                    classAverage: parseFloat(sinifOrtalamasi)
                });
            }

            const yeniData = { id: ogr.id, name: ogr.name, exams: mevcutExams };

            try {
                const basarili = await githubaKaydet(dosyaAdi, JSON.stringify(yeniData, null, 2), token);
                if (basarili) {
                    basariliSayisi++;
                    document.getElementById(`satir_${ogr.id}`).className = 'ogrenci-satiri basarili';
                } else {
                    hataliOgrenciler.push(ogr.id);
                    document.getElementById(`satir_${ogr.id}`).className = 'ogrenci-satiri hatali';
                }
            } catch (error) {
                hataliOgrenciler.push(ogr.id);
                document.getElementById(`satir_${ogr.id}`).className = 'ogrenci-satiri hatali';
            }
        }

        if (hataliOgrenciler.length === 0) {
            sonucDiv.className = 'sonuc success';
            sonucDiv.innerHTML = `✅ Başarıyla tamamlandı! ${basariliSayisi} öğrenci işlendi.`;
            document.getElementById('btnTekrar').style.display = 'none';
            document.getElementById('btnOlustur').style.display = 'block';
        } else {
            sonucDiv.className = 'sonuc error';
            sonucDiv.innerHTML = `⚠️ ${hataliOgrenciler.length} öğrencide hata oluştu. Kırmızı satırları kontrol edip "Hatalıları Tekrar Dene" butonuna basın.`;
            document.getElementById('btnTekrar').style.display = 'block';
            document.getElementById('btnOlustur').style.display = 'none';
        }
    }

    function temizle() {
        hataliOgrenciler = [];
        sinifListesi.forEach(ogrenci => {
            const input = document.getElementById(`net_${ogrenci.id}`);
            const checkbox = document.getElementById(`girmedi_${ogrenci.id}`);
            const satir = document.getElementById(`satir_${ogrenci.id}`);
            input.value = '';
            input.disabled = false;
            checkbox.checked = false;
            satir.className = 'ogrenci-satiri';
        });
        document.getElementById('btnTekrar').style.display = 'none';
        document.getElementById('btnOlustur').style.display = 'block';
        document.getElementById('sonuc').className = 'sonuc';
    }
    </script>
</body>
</html>
