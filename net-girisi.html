<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBS Yönetici Paneli</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* SİYAH ARKA PLAN */
        body { 
            background-color: #000000; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
        }
        
        .main-wrapper { width: 100%; max-width: 1550px; background: #1a1a1a; border-radius: 16px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); overflow: hidden; }
        
        /* MAVİ ÜST BAŞLIK */
        .header { background: #1e3c72; color: white; padding: 25px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 26px; letter-spacing: 1px; }

        .layout-grid { display: grid; grid-template-columns: 1fr 400px; gap: 25px; padding: 25px; }
        
        .left-panel { display: flex; flex-direction: column; gap: 25px; }
        .right-panel { display: flex; flex-direction: column; gap: 25px; }

        /* KUTULAR VE MAVİ BAŞLIK ŞERİTLERİ */
        .box-wrapper { border: 2px solid #1e3c72; border-radius: 12px; background: white; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .box-title { background: #1e3c72; color: white; padding: 12px 20px; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .box-content { padding: 20px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; font-weight: 600; color: #34495e; margin-bottom: 6px; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 15px; transition: 0.3s; }
        .input-group input:focus { border-color: #1e3c72; outline: none; box-shadow: 0 0 8px rgba(30, 60, 114, 0.3); }

        /* BEYAZ VE KREM ZEBRA */
        .ogrenci-liste-container { max-height: 60vh; overflow-y: auto; border: none; background: white; }
        .ogrenci-liste-container::-webkit-scrollbar { width: 8px; }
        .ogrenci-liste-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        .ogrenci-liste-container::-webkit-scrollbar-thumb { background: #1e3c72; border-radius: 8px; }

        .ogrenci-satiri { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; transition: 0.2s; }
        .ogrenci-satiri:nth-child(odd) { background-color: #ffffff; }
        .ogrenci-satiri:nth-child(even) { background-color: #fdf5e6; }
        .ogrenci-satiri:hover { background-color: #e3f2fd; }
        
        .ogrenci-satiri.basarili { background-color: #d4edda !important; pointer-events: none; opacity: 0.7; }
        .ogrenci-satiri.hatali { background-color: #f8d7da !important; }
        
        .ogrenci-bilgi { flex: 1; }
        .ogrenci-adi { font-weight: bold; color: #2c3e50; font-size: 15px; }
        .ogrenci-id { font-size: 11px; color: #7f8c8d; margin-top: 2px; }
        
        .net-input { width: 100px; padding: 8px; border: 2px solid #bdc3c7; border-radius: 6px; text-align: center; font-size: 15px; margin-right: 15px; font-weight: bold; transition: 0.2s; }
        .net-input.invalid { border-color: #e74c3c; background-color: #fadbd8; color: #c0392b; }
        
        .buttons { display: flex; gap: 15px; margin-top: 10px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-olustur { background: #2ecc71; color: white; }
        .btn-olustur:hover { background: #27ae60; }
        .btn-olustur:disabled { background: #555; color: #aaa; cursor: not-allowed; opacity: 0.7; }
        .btn-tekrar { background: #e74c3c; color: white; display: none; }
        .btn-tekrar:hover { background: #c0392b; }
        .btn-temizle { background: #7f8c8d; color: white; }
        .btn-temizle:hover { background: #34495e; }

        .sonuc { margin-top: 15px; padding: 15px; border-radius: 8px; display: none; font-weight: bold; text-align: center; }
        .success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; display: block; }
        .error { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; display: block; }
        .info { background: #d1ecf1; color: #0c5460; border: 2px solid #bee5eb; display: block; }

        /* SAĞ PANEL TABLOLARI (İKİSİNİN DE BAŞLIĞI MAVİ) */
        .mini-card { border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); overflow: hidden; border: 2px solid #1e3c72; }
        
        .theme-blue .mini-card-header { background: #1e3c72; color: white; padding: 12px; font-weight: bold; font-size: 14px; text-align: center; }
        .theme-blue .mini-table th { background: #d6eaf8; color: #154360; padding: 8px; text-align: left; border-bottom: 2px solid #aed6f1; }
        .theme-blue .mini-table td { padding: 8px; border-bottom: 1px solid #aed6f1; color: #2c3e50; background: #fbfcfc; }
        
        .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .mini-table tr:last-child td { border-bottom: none; }

        /* TOKEN KUTUSU */
        .token-box { border: 2px solid #f1c40f; border-radius: 10px; background: #fffdf5; padding: 15px; }
        .token-box input { width: 100%; padding: 10px; border: 2px solid #bdc3c7; border-radius: 6px; font-size: 14px; }

        @media (max-width: 1024px) {
            .layout-grid { grid-template-columns: 1fr; padding: 15px; }
            .ogrenci-liste-container { max-height: none; }
        }
        @media (max-width: 600px) {
            .ogrenci-satiri { flex-direction: column; align-items: flex-start; gap: 8px; padding: 10px; }
            .ogrenci-satiri > div:last-child { width: 100%; display: flex; justify-content: space-between; align-items: center; }
            .net-input { width: 60%; margin-right: 0; }
            .buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="header">
            <h1>🎯 VBS Deneme Sonucu Giriş Paneli</h1>
        </div>

        <div class="layout-grid">
            <!-- SOL TARAF -->
            <div class="left-panel">
                
                <!-- Deneme Bilgileri Kutusu -->
                <div class="box-wrapper">
                    <div class="box-title">📝 Deneme Bilgileri</div>
                    <div class="box-content">
                        <div class="input-group">
                            <label>🏷️ Deneme Adı</label>
                            <input type="text" id="denemeAdiInput" placeholder="Örn: 1. Deneme" oninput="formuKontrolEt()">
                        </div>
                        <div class="input-group" style="margin-bottom:0;">
                            <label>📚 Toplam Soru Sayısı</label>
                            <input type="number" id="soruSayisiInput" min="1" placeholder="Örn: 80" oninput="tumKutulariKontrolEt()">
                        </div>
                    </div>
                </div>

                <!-- Öğrenci Netleri Kutusu -->
                <div class="box-wrapper">
                    <div class="box-title">👥 Öğrenci Netleri</div>
                    <div class="box-content" style="padding: 0;">
                        <div class="ogrenci-liste-container" id="sinifListesi" style="max-height: 50vh;"></div>
                    </div>
                </div>

                <div class="buttons">
                    <button class="btn-olustur" id="btnOlustur" onclick="jsonOlustur(false)" disabled>🚀 KAYDET</button>
                    <button class="btn-tekrar" id="btnTekrar" onclick="jsonOlustur(true)">🔄 HATALILARI TEKRAR DENE</button>
                    <button class="btn-temizle" onclick="temizle()">🗑️ TEMİZLE</button>
                </div>

                <div id="sonuc" class="sonuc"></div>
            </div>

            <!-- SAĞ TARAF -->
            <div class="right-panel">
                <div class="token-box">
                    <div style="font-size: 16px; font-weight: bold; color: #1e3c72; margin-bottom: 8px;">🔑 Sistem Bağlantısı</div>
                    <label style="font-size: 13px; font-weight: 600; color: #856404; margin-bottom: 5px; display: block;">GitHub Token</label>
                    <input type="password" id="tokenInput" placeholder="ghp_... şeklinde token" oninput="formuKontrolEt()">
                </div>

                <div class="mini-card theme-blue">
                    <div class="mini-card-header" id="sonDenemeBaslik">Son Yapılan Deneme Sıralaması</div>
                    <table class="mini-table">
                        <thead>
                            <tr>
                                <th>Sıra</th>
                                <th>Adı Soyadı</th>
                                <th>Net</th>
                            </tr>
                        </thead>
                        <tbody id="sonDenemeTablosu">
                            <tr><td colspan="3" style="text-align:center;">Yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="mini-card theme-blue">
                    <div class="mini-card-header">Tüm Zamanlar Sıralaması</div>
                    <table class="mini-table">
                        <thead>
                            <tr>
                                <th>Sıra</th>
                                <th>Adı Soyadı</th>
                                <th>Ort.</th>
                            </tr>
                        </thead>
                        <tbody id="genelSiralamaTablosu">
                            <tr><td colspan="3" style="text-align:center;">Yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
    const GITHUB_USER = "gereksiz3x";
    const GITHUB_REPO = "vbs";
    const BRANCH = "main";

    const sinifListesi = [
        {id: "562", name: "Durmuş Efe Akkanat"},
        {id: "853", name: "İclal Atalan"},
        {id: "145", name: "Hilal Aşık"},
        {id: "462", name: "Efe Barsan"},
        {id: "811", name: "Hülya Bila"},
        {id: "371", name: "Begüm Bindebir"},
        {id: "756", name: "Yarım Çağlar"},
        {id: "752", name: "Belinay Cifçi"},
        {id: "1076", name: "Büşra Karahanlı"},
        {id: "981", name: "Nurten Karataş"},
        {id: "801", name: "Emir Kaya"},
        {id: "893", name: "Hacer Kılınç"},
        {id: "1023", name: "Ece Sert"},
        {id: "157", name: "Ömür Beren Türkmenoğlu"},
        {id: "1142", name: "Nur Eymen Yılmaz"}
    ];

    let hataliOgrenciler = []; 
    let tumVeriler = {};

    window.onload = function() {
        const savedToken = localStorage.getItem('vbs_token');
        if (savedToken) {
            document.getElementById('tokenInput').value = savedToken;
        }
        listeyiOlustur();
        istatistikleriYukle();
        formuKontrolEt(); 
    };

    function listeyiOlustur() {
        const listDiv = document.getElementById('sinifListesi');
        listDiv.innerHTML = '';
        sinifListesi.forEach(ogrenci => {
            const satir = document.createElement('div');
            satir.className = 'ogrenci-satiri';
            satir.id = `satir_${ogrenci.id}`;
            satir.innerHTML = `
                <div class="ogrenci-bilgi">
                    <div class="ogrenci-adi">${ogrenci.name}</div>
                    <div class="ogrenci-id">No: ${ogrenci.id}</div>
                </div>
                <div style="display: flex; align-items: center;">
                    <input type="number" class="net-input" id="net_${ogrenci.id}" placeholder="Net" step="0.25" min="0" oninput="kontrolEt('${ogrenci.id}')">
                    <input type="checkbox" class="girmedi-checkbox" id="girmedi_${ogrenci.id}" onchange="girmediDegisti('${ogrenci.id}')">
                    <label for="girmedi_${ogrenci.id}" style="font-size:12px; color:#555; font-weight:bold; margin-left:5px; cursor:pointer;">Girmedi</label>
                </div>
            `;
            listDiv.appendChild(satir);
        });
    }

    function girmediDegisti(id) {
        const checkbox = document.getElementById(`girmedi_${id}`);
        const input = document.getElementById(`net_${id}`);
        if (checkbox.checked) {
            input.disabled = true;
            input.value = '';
            input.classList.remove('invalid');
        } else {
            input.disabled = false;
        }
        formuKontrolEt();
    }

    function kontrolEt(id) {
        const input = document.getElementById(`net_${id}`);
        const checkbox = document.getElementById(`girmedi_${id}`);
        const soruSayisi = parseFloat(document.getElementById('soruSayisiInput').value);
        
        let deger = input.value.trim();
        
        if (deger === '' || checkbox.checked) {
            input.classList.remove('invalid');
            formuKontrolEt();
            return;
        }

        const net = parseFloat(deger);
        let hatali = false;

        if (deger.includes('.')) {
            const parts = deger.split('.');
            const kusurKismi = parts[1];
            if (!['25', '5', '50', '75', '0', '00'].includes(kusurKismi) && !['250', '500', '750'].includes(kusurKismi)) {
                hatali = true;
            }
        }

        if (!isNaN(soruSayisi) && soruSayisi > 0 && net > soruSayisi) hatali = true;

        if (hatali) {
            input.classList.add('invalid');
        } else {
            input.classList.remove('invalid');
        }

        formuKontrolEt();
    }

    function tumKutulariKontrolEt() {
        sinifListesi.forEach(ogr => {
            const input = document.getElementById(`net_${ogr.id}`);
            if(input.value.trim() !== '') {
                kontrolEt(ogr.id);
            }
        });
    }

    function formuKontrolEt() {
        const token = document.getElementById('tokenInput').value.trim();
        const denemeAdi = document.getElementById('denemeAdiInput').value.trim();
        const soruSayisi = parseFloat(document.getElementById('soruSayisiInput').value);
        const btn = document.getElementById('btnOlustur');
        
        let formGecerli = true;

        if (!token || !denemeAdi || isNaN(soruSayisi) || soruSayisi <= 0) {
            formGecerli = false;
        }

        const invalidInputs = document.querySelectorAll('.net-input.invalid');
        if (invalidInputs.length > 0) {
            formGecerli = false;
        }

        sinifListesi.forEach(ogr => {
            const input = document.getElementById(`net_${ogr.id}`);
            const cb = document.getElementById(`girmedi_${ogr.id}`);
            if (!cb.checked && input.value.trim() === '') {
                formGecerli = false;
            }
        });

        if (formGecerli) {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    async function istatistikleriYukle() {
        tumVeriler = {};
        await Promise.all(sinifListesi.map(async ogr => {
            try {
                const res = await fetch(`data/${ogr.id}.json?t=${Date.now()}`);
                if (res.ok) {
                    tumVeriler[ogr.id] = await res.json();
                } else {
                    tumVeriler[ogr.id] = { id: ogr.id, name: ogr.name, exams: [] };
                }
            } catch (e) {
                tumVeriler[ogr.id] = { id: ogr.id, name: ogr.name, exams: [] };
            }
        }));

        let enSonDenemeAdi = "-";
        let maxExamCount = 0;
        Object.values(tumVeriler).forEach(v => {
            if(v.exams && v.exams.length > maxExamCount) {
                maxExamCount = v.exams.length;
                if(v.exams.length > 0) enSonDenemeAdi = v.exams[0].examName;
            }
        });

        document.getElementById('sonDenemeBaslik').innerText = "Son Yapılan Deneme Sıralaması";

        let sonDenemeNetleri = [];
        Object.values(tumVeriler).forEach(v => {
            if(v.exams) {
                const exam = v.exams.find(e => e.examName === enSonDenemeAdi);
                if(exam && exam.score !== null) {
                    const ogrObj = sinifListesi.find(o => o.id === String(v.id));
                    const displayName = ogrObj ? ogrObj.name : v.name;
                    sonDenemeNetleri.push({ name: displayName, score: exam.score });
                }
            }
        });
        sonDenemeNetleri.sort((a, b) => b.score - a.score);
        
        const sonDenemeTbody = document.getElementById('sonDenemeTablosu');
        sonDenemeTbody.innerHTML = '';
        if(sonDenemeNetleri.length === 0) {
            sonDenemeTbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Henüz veri yok</td></tr>';
        } else {
            sonDenemeNetleri.forEach((ogr, i) => {
                sonDenemeTbody.innerHTML += `<tr><td><strong>${i+1}</strong></td><td>${ogr.name}</td><td><strong>${ogr.score}</strong></td></tr>`;
            });
        }

        let genelOrtalamalar = [];
        Object.values(tumVeriler).forEach(v => {
            if(v.exams && v.exams.length > 0) {
                const toplam = v.exams.reduce((sum, e) => sum + e.score, 0);
                const ogrObj = sinifListesi.find(o => o.id === String(v.id));
                const displayName = ogrObj ? ogrObj.name : v.name;
                genelOrtalamalar.push({ name: displayName, avg: toplam / v.exams.length });
            }
        });
        genelOrtalamalar.sort((a, b) => b.avg - a.avg);

        const genelTbody = document.getElementById('genelSiralamaTablosu');
        genelTbody.innerHTML = '';
        if(genelOrtalamalar.length === 0) {
            genelTbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Henüz veri yok</td></tr>';
        } else {
            genelOrtalamalar.forEach((ogr, i) => {
                genelTbody.innerHTML += `<tr><td><strong>${i+1}</strong></td><td>${ogr.name}</td><td><strong>${ogr.avg.toFixed(2)}</strong></td></tr>`;
            });
        }
    }

    async function githubaKaydet(dosyaAdi, icerik, token) {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data/${dosyaAdi}`;
        let sha = null;
        
        try {
            const kontrol = await fetch(url, { headers: { Authorization: `token ${token}` } });
            if (kontrol.ok) {
                const veri = await kontrol.json();
                sha = veri.sha;
            }
        } catch(e) {}

        const base64Icerik = btoa(unescape(encodeURIComponent(icerik)));

        const response = await fetch(url, {
            method: 'PUT',
            headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: `Güncelleme: ${dosyaAdi}`,
                content: base64Icerik,
                sha: sha,
                branch: BRANCH
            })
        });

        return response.ok;
    }

    async function jsonOlustur(sadeceHatalilar) {
        const sonucDiv = document.getElementById('sonuc');
        const token = document.getElementById('tokenInput').value.trim();
        const denemeAdi = document.getElementById('denemeAdiInput').value.trim();
        const toplamSoru = parseFloat(document.getElementById('soruSayisiInput').value);
        
        localStorage.setItem('vbs_token', token);

        const islenecekler = [];
        for (let ogr of sinifListesi) {
            const input = document.getElementById(`net_${ogr.id}`);
            const checkbox = document.getElementById(`girmedi_${ogr.id}`);
            const net = parseFloat(input.value);

            if (sadeceHatalilar && !hataliOgrenciler.includes(ogr.id)) continue;

            if (!checkbox.checked && !isNaN(net)) {
                islenecekler.push({ ...ogr, score: net });
            } else if (!sadeceHatalilar) {
                islenecekler.push({ ...ogr, score: null });
            }
        }

        if (islenecekler.length === 0) {
            sonucDiv.className = 'sonuc error';
            sonucDiv.innerHTML = '❌ İşlenecek öğrenci bulunamadı!';
            return;
        }

        sonucDiv.className = 'sonuc info';
        sonucDiv.innerHTML = '⏳ İşleniyor, lütfen bekleyin...';
        
        document.getElementById('btnOlustur').disabled = true; 

        const girenler = islenecekler.filter(o => o.score !== null);
        girenler.sort((a, b) => b.score - a.score);
        girenler.forEach((ogr, index) => { ogr.rank = index + 1; });
        
        const sinifOrtalamasi = girenler.length > 0 ? (girenler.reduce((a,b)=>a+b.score, 0) / girenler.length).toFixed(2) : 0;
        const bugun = new Date().toISOString().split('T')[0];

        let basariliSayisi = 0;
        hataliOgrenciler = []; 

        for (let ogr of islenecekler) {
            const dosyaAdi = `${ogr.id}.json`;
            let mevcutExams = [];
            
            try {
                const res = await fetch(`data/${dosyaAdi}?t=${Date.now()}`);
                if (res.ok) {
                    const eskiData = await res.json();
                    mevcutExams = eskiData.exams || [];
                }
            } catch (e) {}

            const zatenVar = mevcutExams.find(e => e.examName === denemeAdi);
            if (zatenVar) {
                document.getElementById(`satir_${ogr.id}`).className = 'ogrenci-satiri basarili';
                continue; 
            }

            if (ogr.score !== null) {
                const ogrSirasi = girenler.find(o => o.id === ogr.id);
                const yuzde = ((ogr.score / toplamSoru) * 100).toFixed(2);
                
                mevcutExams.unshift({
                    examName: denemeAdi,
                    examDate: bugun,
                    score: ogr.score,
                    yuzde: yuzde,
                    rank: ogrSirasi.rank,
                    totalStudents: girenler.length,
                    classAverage: parseFloat(sinifOrtalamasi),
                    totalQuestions: toplamSoru
                });
            }

            const yeniData = { id: ogr.id, name: ogr.name, exams: mevcutExams };

            try {
                const basarili = await githubaKaydet(dosyaAdi, JSON.stringify(yeniData, null, 2), token);
                if (basarili) {
                    basariliSayisi++;
                    document.getElementById(`satir_${ogr.id}`).className = 'ogrenci-satiri basarili';
                } else {
                    hataliOgrenciler.push(ogr.id);
                    document.getElementById(`satir_${ogr.id}`).className = 'ogrenci-satiri hatali';
                }
            } catch (error) {
                hataliOgrenciler.push(ogr.id);
                document.getElementById(`satir_${ogr.id}`).className = 'ogrenci-satiri hatali';
            }
        }

        if (hataliOgrenciler.length === 0) {
            sonucDiv.className = 'sonuc success';
            sonucDiv.innerHTML = `✅ Başarıyla tamamlandı! ${basariliSayisi} öğrenci işlendi.`;
            document.getElementById('btnTekrar').style.display = 'none';
            document.getElementById('btnOlustur').style.display = 'block';
            document.getElementById('btnOlustur').disabled = false; 
            
            setTimeout(istatistikleriYukle, 1500);
            
        } else {
            sonucDiv.className = 'sonuc error';
            sonucDiv.innerHTML = `⚠️ ${hataliOgrenciler.length} öğrencide hata oluştu. Kırmızı satırları kontrol edip "Hatalıları Tekrar Dene" butonuna basın.`;
            document.getElementById('btnTekrar').style.display = 'block';
            document.getElementById('btnOlustur').style.display = 'none';
        }
    }

    function temizle() {
        hataliOgrenciler = [];
        sinifListesi.forEach(ogrenci => {
            const input = document.getElementById(`net_${ogrenci.id}`);
            const checkbox = document.getElementById(`girmedi_${ogrenci.id}`);
